name: Arena Desktop / Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/arena-desktop-windows.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/arena-desktop-windows.yml'

permissions:
  contents: read

jobs:
  build:
    name: Test and build Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Check, test and package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & npm.cmd run dist:win 2>&1 | Tee-Object -FilePath package.log
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            $detail = (Get-Content package.log -Tail 25) -join "`n"
            # GitHub annotations are truncated at 4 KB; retain the final error,
            # not the earlier passing-test output.
            if ($detail.Length -gt 3000) { $detail = $detail.Substring($detail.Length - 3000) }
            $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows packaging failed::$detail"
            exit $result
          }
      - name: Launch the real packaged app offline on Windows
        shell: pwsh
        run: |
          try {
            ./scripts/smoke-windows.ps1
          } catch {
            $detail = $_.ToString().Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows startup failed::$detail"
            exit 1
          }
      - name: Upload installer and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Arena-Desktop-Windows-x64
          path: |
            desktop/dist/*.exe
            desktop/dist/SHA256SUMS.txt
            desktop/dist/README.fa.md
          if-no-files-found: error
          retention-days: 30
